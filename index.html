<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Signal</title>
<style>
  html,body{margin:0;height:100%;background:#0d1014;overflow:hidden;
    font-family:ui-monospace,Menlo,Consolas,monospace;color:#c8ccd2;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  canvas{display:block;touch-action:none;}
  #hint{position:fixed;left:0;right:0;bottom:10px;text-align:center;font-size:12px;
    color:#4a5058;pointer-events:none;letter-spacing:.08em;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">move to tune &nbsp;·&nbsp; stop moving to lock a voice</div>
<script>
(() => {
'use strict';

const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W = 0, H = 0;
const resize = () => {
  W = c.width = innerWidth;
  H = c.height = innerHeight;
  c.style.width = W + 'px';
  c.style.height = H + 'px';
};
addEventListener('resize', resize);
resize();

const TOL = 0.045;
const GRAD = 0.17;
const LOCK_TIME = 1.4;
const KEY_SPEED = 0.2;
const MOVE_GATE = 0.25;
const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);

const VOICES = [
  'the river is low tonight',
  'she left the light on for you',
  'seven minutes past the hour',
  'do not answer the second call',
  'the field is quiet now',
  'tell them the road is closed',
  'i counted the boats again',
  'the kettle is still warm',
  'no one came down the lane',
  'keep the window open',
  'the clock in the hall stopped',
  'we will try again at dawn'
];

const DIFFS = [
  { signals: 5, time: 22, amp: 0.014, spd: 0.6 },
  { signals: 7, time: 30, amp: 0.024, spd: 0.9 },
  { signals: 9, time: 48, amp: 0.034, spd: 1.1 }
];

const S = {
  phase: 'title',
  night: 0,
  t: 0,
  timeLeft: 0,
  total: 0,
  heard: 0,
  tuner: 0.5,
  lastTuner: 0.5,
  speed: 0,
  closeness: 0,
  prox: 0,
  bestSig: null,
  proxSig: null,
  sigs: [],
  transcript: []
};

const shuffle = (a) => {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
};

const startNight = (n) => {
  S.night = n;
  const d = DIFFS[Math.min(n, DIFFS.length - 1)];
  S.timeLeft = d.time;
  S.total = d.signals;
  S.heard = 0;
  S.transcript = [];
  S.tuner = 0.5;
  S.lastTuner = 0.5;
  S.speed = 0;
  S.t = 0;
  const pool = shuffle(VOICES.slice());
  S.sigs = [];
  for (let i = 0; i < d.signals; i++) {
    const base = 0.08 + ((i + 0.5) / d.signals) * 0.84 + (Math.random() - 0.5) * 0.02;
    S.sigs.push({
      base: base,
      amp: d.amp * (0.8 + Math.random() * 0.4),
      spd: d.spd * (0.7 + Math.random() * 0.6),
      phase: Math.random() * Math.PI * 2,
      text: pool[i % pool.length],
      heard: false,
      lock: 0,
      freq: base
    });
  }
  S.phase = 'play';
};

const endNight = () => {
  if (S.heard >= S.total) {
    S.phase = (S.night >= DIFFS.length - 1) ? 'win' : 'dawn_ok';
  } else {
    S.phase = 'over';
  }
};

const advance = () => {
  initAudio();
  if (AC && AC.state === 'suspended') AC.resume();
  if (S.phase === 'title') { startNight(0); return; }
  if (S.phase === 'dawn_ok') { startNight(S.night + 1); return; }
  if (S.phase === 'win' || S.phase === 'over') { S.phase = 'title'; S.night = 0; return; }
};

const update = (dt) => {
  if (keys.left) S.tuner -= KEY_SPEED * dt;
  if (keys.right) S.tuner += KEY_SPEED * dt;
  S.tuner = clamp(S.tuner, 0, 1);
  S.speed = Math.abs(S.tuner - S.lastTuner) / Math.max(dt, 1e-4);
  S.lastTuner = S.tuner;

  if (S.phase !== 'play') {
    S.speed = 0;
    S.closeness = 0;
    S.prox = 0;
    S.bestSig = null;
    S.proxSig = null;
    return;
  }

  S.t += dt;
  S.timeLeft -= dt;

  for (const s of S.sigs) {
    s.freq = s.base + s.amp * Math.sin(S.t * s.spd + s.phase);
  }

  let best = 0, bestSig = null, bestProx = 0, proxSig = null;
  for (const s of S.sigs) {
    if (s.heard) continue;
    const d = Math.abs(S.tuner - s.freq);
    const cl = Math.max(0, 1 - d / TOL);
    if (cl > best) { best = cl; bestSig = s; }
    const px = Math.max(0, 1 - d / GRAD);
    if (px > bestProx) { bestProx = px; proxSig = s; }
  }
  S.closeness = best;
  S.bestSig = bestSig;
  S.prox = bestProx;
  S.proxSig = proxSig;

  for (const s of S.sigs) {
    if (s.heard) continue;
    const d = Math.abs(S.tuner - s.freq);
    const cl = Math.max(0, 1 - d / TOL);
    if (cl > 0.5 && S.speed < MOVE_GATE) s.lock += dt;
    else s.lock = Math.max(0, s.lock - dt * 0.35);
    if (s.lock >= LOCK_TIME) {
      s.heard = true;
      S.heard++;
      S.transcript.push(s.text);
    }
  }

  if (S.heard >= S.total || S.timeLeft <= 0) endNight();
};

/* ---- audio ---- */
let AC = null, master = null, staticGain = null, oscs = [];
const initAudio = () => {
  if (AC) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  AC = new Ctx();
  master = AC.createGain();
  master.gain.value = 0.5;
  master.connect(AC.destination);

  const len = Math.floor(AC.sampleRate * 2);
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource();
  src.buffer = buf;
  src.loop = true;
  const filt = AC.createBiquadFilter();
  filt.type = 'bandpass';
  filt.frequency.value = 1300;
  filt.Q.value = 0.7;
  staticGain = AC.createGain();
  staticGain.gain.value = 0.3;
  src.connect(filt);
  filt.connect(staticGain);
  staticGain.connect(master);
  src.start();

  for (let i = 0; i < 12; i++) {
    const o = AC.createOscillator();
    o.type = 'sine';
    o.frequency.value = 300;
    const g = AC.createGain();
    g.gain.value = 0;
    o.connect(g);
    g.connect(master);
    o.start();
    oscs.push({ o: o, g: g });
  }
};

const updateAudio = () => {
  if (!AC) return;
  if (S.phase !== 'play') {
    master.gain.value = 0.18;
    staticGain.gain.value = 0.06;
    for (const oc of oscs) oc.g.gain.value = 0;
    return;
  }
  master.gain.value = 0.5;
  const staticLevel = 0.12 + (1 - S.prox) * 0.85 + Math.min(0.6, S.speed * 0.7);
  staticGain.gain.value = clamp(staticLevel, 0, 1) * 0.42;
  for (let i = 0; i < oscs.length; i++) {
    const s = S.sigs[i];
    const oc = oscs[i];
    if (!s || s.heard) { oc.g.gain.value = 0; continue; }
    const d = Math.abs(S.tuner - s.freq);
    const cl = Math.max(0, 1 - d / TOL);
    oc.o.frequency.value = 220 + s.base * 520;
    oc.g.gain.value = Math.pow(cl, 2) * 0.2;
  }
};

/* ---- input ---- */
const keys = { left: false, right: false };
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
  if (e.key === ' ' || e.key === 'Enter') advance();
});
addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
});

const band = () => ({ x: W * 0.08, y: H * 0.42, w: W * 0.84, h: H * 0.16 });

const setTunerFromX = (x) => {
  const b = band();
  S.tuner = clamp((x - b.x) / b.w, 0, 1);
};
let pointerDown = false;
c.addEventListener('pointerdown', (e) => {
  pointerDown = true;
  if (S.phase !== 'play') advance();
  else setTunerFromX(e.clientX);
});
c.addEventListener('pointermove', (e) => {
  if (S.phase === 'play' && (pointerDown || e.pointerType === 'mouse')) setTunerFromX(e.clientX);
});
c.addEventListener('pointerup', () => { pointerDown = false; });

/* ---- render ---- */
const render = () => {
  ctx.fillStyle = '#0d1014';
  ctx.fillRect(0, 0, W, H);

  const b = band();
  const snow = S.phase === 'play'
    ? Math.min(1, (1 - S.prox) * 0.9 + Math.min(0.5, S.speed * 0.7))
    : 0.25;

  ctx.fillStyle = '#141920';
  ctx.fillRect(b.x, b.y, b.w, b.h);

  const n = Math.floor(snow * 900);
  ctx.fillStyle = '#39414c';
  for (let i = 0; i < n; i++) {
    ctx.fillRect(b.x + Math.random() * b.w, b.y + Math.random() * b.h, 1.5, 1.5);
  }

  for (const s of S.sigs) {
    if (s.heard) continue;
    const d = Math.abs(S.tuner - s.freq);
    const cl = Math.max(0, 1 - d / TOL);
    const px = Math.max(0, 1 - d / GRAD);
    let a = Math.pow(cl, 1.5);
    if (s === S.proxSig && s !== S.bestSig) a = Math.max(a, px * px * 0.4);
    if (a <= 0.02) continue;
    const gx = b.x + s.freq * b.w;
    const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
    g.addColorStop(0, 'rgba(240,180,90,0)');
    g.addColorStop(0.5, 'rgba(240,180,90,' + (a * 0.55) + ')');
    g.addColorStop(1, 'rgba(240,180,90,0)');
    ctx.fillStyle = g;
    ctx.fillRect(gx - 7, b.y, 14, b.h);
  }

  ctx.strokeStyle = '#2a313a';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(b.x, b.y - 10);
  ctx.lineTo(b.x + b.w, b.y - 10);
  ctx.moveTo(b.x, b.y + b.h + 10);
  ctx.lineTo(b.x + b.w, b.y + b.h + 10);
  ctx.stroke();
  ctx.fillStyle = '#3a424c';
  ctx.font = '11px ui-monospace, monospace';
  for (let i = 0; i <= 10; i++) {
    const x = b.x + b.w * i / 10;
    ctx.fillRect(x, b.y - 10, 1, 6);
    ctx.fillRect(x, b.y + b.h + 4, 1, 6);
  }

  const nx = b.x + S.tuner * b.w;
  ctx.strokeStyle = '#e8e2d6';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(nx, b.y - 16);
  ctx.lineTo(nx, b.y + b.h + 16);
  ctx.stroke();

  const bs = S.bestSig;
  const locking = bs && bs.lock > 0.05;
  if (locking) {
    const p = clamp(bs.lock / LOCK_TIME, 0, 1);
    ctx.fillStyle = 'rgba(240,180,90,0.25)';
    ctx.fillRect(b.x, b.y + b.h + 26, b.w, 4);
    ctx.fillStyle = '#f0b45a';
    ctx.fillRect(b.x, b.y + b.h + 26, b.w * p, 4);
    if (bs.lock > 0.6) {
      ctx.fillStyle = '#e8e2d6';
      ctx.font = '20px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(bs.text, W / 2, b.y + b.h + 66);
      ctx.textAlign = 'left';
    }
  }

  if (S.phase === 'play') {
    ctx.textAlign = 'center';
    ctx.font = '13px ui-monospace, monospace';
    if (S.closeness > 0.5 && S.speed >= MOVE_GATE) {
      ctx.fillStyle = '#f0b45a';
      ctx.fillText('hold still', W / 2, b.y + b.h + 92);
    } else if (!locking && S.prox > 0.45) {
      ctx.fillStyle = '#6b7482';
      ctx.fillText('signal nearby', W / 2, b.y + b.h + 92);
    }
    if (S.night === 0) {
      ctx.fillStyle = '#3f4650';
      ctx.font = '12px ui-monospace, monospace';
      ctx.fillText('sweep the band · static softens near a voice · stop moving to lock it · all voices before dawn', W / 2, b.y + b.h + 118);
    }
    ctx.textAlign = 'left';
  }

  ctx.fillStyle = '#8b93a0';
  ctx.font = '13px ui-monospace, monospace';
  ctx.fillText('NIGHT ' + (S.night + 1) + ' / ' + DIFFS.length, 24, 34);
  ctx.textAlign = 'right';
  const tl = Math.max(0, Math.ceil(S.timeLeft));
  ctx.fillStyle = (S.phase === 'play' && tl <= 10) ? '#e0685a' : '#8b93a0';
  ctx.fillText('DAWN IN ' + tl + 's', W - 24, 34);
  ctx.textAlign = 'left';
  ctx.fillStyle = S.heard >= S.total ? '#7fbf7f' : '#8b93a0';
  ctx.fillText('HEARD ' + S.heard + ' / ' + S.total, 24, 56);

  const baseY = H - 28;
  ctx.fillStyle = '#f0b45a';
  ctx.font = '13px ui-monospace, monospace';
  for (let i = 0; i < S.transcript.length; i++) {
    const line = S.transcript[S.transcript.length - 1 - i];
    ctx.fillText('· ' + line, 24, baseY - i * 18);
  }

  if (S.phase !== 'play') {
    ctx.fillStyle = 'rgba(13,16,20,0.78)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#e8e2d6';
    if (S.phase === 'title') {
      ctx.font = '44px ui-monospace, monospace';
      ctx.fillText('SIGNAL', W / 2, H / 2 - 40);
      ctx.fillStyle = '#8b93a0';
      ctx.font = '14px ui-monospace, monospace';
      ctx.fillText('voices drift across the band', W / 2, H / 2 + 4);
      ctx.fillText('static softens as you near one', W / 2, H / 2 + 26);
      ctx.fillText('stop moving to lock it · move to tune', W / 2, H / 2 + 48);
      ctx.fillStyle = '#c98a3f';
      ctx.fillText('transcribe every voice before dawn', W / 2, H / 2 + 72);
      ctx.fillStyle = '#f0b45a';
      ctx.fillText('press or click to begin', W / 2, H / 2 + 104);
    } else if (S.phase === 'dawn_ok') {
      ctx.font = '28px ui-monospace, monospace';
      ctx.fillText('DAWN', W / 2, H / 2 - 10);
      ctx.fillStyle = '#8b93a0';
      ctx.font = '14px ui-monospace, monospace';
      ctx.fillText(S.heard + ' of ' + S.total + ' voices transcribed', W / 2, H / 2 + 24);
      ctx.fillStyle = '#f0b45a';
      ctx.fillText('click for the next night', W / 2, H / 2 + 60);
    } else if (S.phase === 'win') {
      ctx.font = '30px ui-monospace, monospace';
      ctx.fillText('THE BAND GOES QUIET', W / 2, H / 2 - 10);
      ctx.fillStyle = '#8b93a0';
      ctx.font = '14px ui-monospace, monospace';
      ctx.fillText('you heard every voice', W / 2, H / 2 + 24);
      ctx.fillStyle = '#f0b45a';
      ctx.fillText('click to start over', W / 2, H / 2 + 60);
    } else if (S.phase === 'over') {
      ctx.font = '30px ui-monospace, monospace';
      ctx.fillText('SIGNAL LOST', W / 2, H / 2 - 10);
      ctx.fillStyle = '#8b93a0';
      ctx.font = '14px ui-monospace, monospace';
      ctx.fillText('dawn came with ' + (S.total - S.heard) + ' voices unheard', W / 2, H / 2 + 24);
      ctx.fillStyle = '#f0b45a';
      ctx.fillText('click to try again', W / 2, H / 2 + 60);
    }
    ctx.textAlign = 'left';
  }
};

let last = performance.now();
const frame = (now) => {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  updateAudio();
  render();
  requestAnimationFrame(frame);
};
requestAnimationFrame(frame);

window.__signal = S;

})();
</script>
</body>
</html>
